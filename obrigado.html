:root{

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:var(--verde-800);color:#fff;padding:clamp(24px,6vw,56px);
  font-family:'Jost','Helvetica Neue',Arial,sans-serif;font-weight:300;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-align:center}
.box{display:grid;justify-items:center;gap:1.35rem;max-width:520px}
img.logo{height:56px;width:auto}
h1{font-weight:300;letter-spacing:-.01em;font-size:clamp(1.6rem,4.4vw,2.3rem);
  line-height:1.15;margin:0;max-width:18ch}
p{margin:0;color:rgba(255,255,255,.8);max-width:44ch;font-size:1rem}
.btn{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;
  padding:.95rem 1.8rem;border-radius:100px;background:var(--verde-600);color:#fff;
  text-decoration:none;border:1px solid transparent;transition:background .38s var(--ease)}
.btn:hover{background:var(--verde-700);border-color:rgba(255,255,255,.34)}
.btn svg{width:17px;height:17px;fill:currentColor;flex:none}
.voltar{font-size:.85rem;color:rgba(255,255,255,.55);text-decoration:none}
.voltar:hover{color:#fff}
.spin{width:26px;height:26px;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;
  border-radius:50%;animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

      Abrir o WhatsApp agora

<script>
/* Página de obrigado: é aqui que a conversão é contada, antes de sair para o
   WhatsApp. O `?c=<contexto>` diz qual CTA converteu; o destino é sempre o
   link curto da loja, que já leva a mensagem configurada no WhatsApp
   Business. */
(function () {
  'use strict';
  var destino = 'https://wa.link/jz4nrm';
  var contexto = new URLSearchParams(location.search).get('c') || 'contato';

  document.getElementById('ir').href = destino;

  /* Empurra o evento para o dataLayer ANTES de sair, para o GTM disparar a
     tag de conversão sabendo qual CTA converteu. No GTM, usar o gatilho de
     Evento Personalizado "conversao_whatsapp". */
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'conversao_whatsapp', contexto: contexto });

  /* 1,8s cobre a carga do container e o disparo da tag em conexão móvel.
     replace() para o botão voltar não cair aqui de novo. */
  setTimeout(function () { location.replace(destino); }, 1800);
})();
</script>
